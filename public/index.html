  <script data-sd142-live-guard>
  (()=>{
    'use strict';
    const nativeSetInterval=window.setInterval.bind(window);
    const nativeAddEventListener=window.addEventListener.bind(window);
    const nativeFetch=window.fetch.bind(window);
    let liveCallback=null,lastRoute='',lastStable='',queuePrimed=false,probeBusy=false;
    const source=fn=>{try{return Function.prototype.toString.call(fn);}catch{return '';}};
    const isLiveRefresh=fn=>typeof fn==='function'&&source(fn).includes('refreshLiveView');
    const dirtyControl=el=>{
      if(el instanceof HTMLInputElement){if(el.type==='checkbox'||el.type==='radio')return el.checked!==el.defaultChecked;return el.value!==el.defaultValue;}
      if(el instanceof HTMLTextAreaElement)return el.value!==el.defaultValue;
      if(el instanceof HTMLSelectElement)return [...el.options].some(option=>option.selected!==option.defaultSelected);
      return false;
    };
    const userBusy=()=>{
      if(document.hidden||document.querySelector('dialog[open]'))return true;
      const active=document.activeElement;
      if(active&&active!==document.body&&(active.matches?.('input,textarea,select,[contenteditable="true"]')||active.closest?.('.r112-global-search')))return true;
      if(document.querySelector('.r112-search-results:not([hidden])'))return true;
      return [...document.querySelectorAll('.workspace-content input,.workspace-content textarea,.workspace-content select')].some(dirtyControl);
    };
    const stableTicket=t=>({id:t.id,key:t.key,version:t.version,workflow_version:t.workflow_version,status:t.status,workflow_status:t.workflow_status,priority:t.priority,assignee_id:t.assignee_id,updated_at:t.updated_at,archived_at:t.archived_at,transitions:(t.transitions||[]).map(x=>[x.to,x.name,x.actor]),sla:(t.sla||[]).map(s=>[s.id??s.name,s.state,Boolean(s.breached),s.due_at,s.completed_at??s.actual_at??null])});
    const stableTicketSignature=data=>JSON.stringify({total:data?.total,page:data?.page,limit:data?.limit,tickets:(data?.tickets||[]).map(stableTicket)});
    async function guardedLivePoll(fn){
      if(!fn||userBusy()||probeBusy)return;
      const hash=location.hash;if(!/^#\/(queue|board)(\?|$)/.test(hash)){fn();return;}probeBusy=true;
      try{const query=hash.split('?')[1]||'',response=await nativeFetch('/api/tickets?'+query,{credentials:'same-origin',cache:'no-store'});if(!response.ok)return;const stable=stableTicketSignature(await response.json());if(lastRoute!==hash){lastRoute=hash;lastStable=stable;if(!queuePrimed){queuePrimed=true;fn();}return;}if(stable===lastStable)return;lastStable=stable;fn();}catch{}finally{probeBusy=false;}
    }
    window.setInterval=function(fn,delay,...args){if(Number(delay)===5000&&isLiveRefresh(fn)){liveCallback=()=>fn(...args);return nativeSetInterval(()=>void guardedLivePoll(liveCallback),5000);}return nativeSetInterval(fn,delay,...args);};
    window.addEventListener=function(type,listener,options){if(type==='focus'&&isLiveRefresh(listener))return nativeAddEventListener(type,()=>{if(liveCallback)void guardedLivePoll(liveCallback);},options);return nativeAddEventListener(type,listener,options);};
    document.documentElement.dataset.queueRefreshGuard='1.4.3';
  })();
  </script>
  <script data-sd143-customer-ui>
  (()=>{
    'use strict';
    const VERSION='1.4.3',$=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],route=()=>location.hash.split('?')[0]||'#/';
    function setRouteClass(main,name){for(const cls of [...main.classList])if(cls.startsWith('sd143-'))main.classList.remove(cls);if(name)main.classList.add(name);}
    function makeSearch(host,selector,placeholder){if(!host||host.querySelector('.sd143-help-search'))return;const form=document.createElement('form');form.className='sd143-help-search';form.setAttribute('role','search');form.innerHTML='<label><span>Potrzebujesz pomocy? Wyszukaj usługę</span><div><input type="search" autocomplete="off" placeholder="'+placeholder+'"><button type="submit" aria-label="Szukaj">⌕</button></div></label><small class="sd143-search-count" aria-live="polite"></small>';host.append(form);const input=$('input',form),count=$('.sd143-search-count',form),filter=()=>{const q=input.value.trim().toLocaleLowerCase('pl');let visible=0;for(const node of $$(selector)){const hit=!q||node.textContent.toLocaleLowerCase('pl').includes(q);node.hidden=!hit;if(hit)visible++;}count.textContent=q?(visible?`Znaleziono: ${visible}`:'Brak pasujących pozycji'):'';};input.addEventListener('input',filter);form.addEventListener('submit',event=>{event.preventDefault();filter();$$(selector).find(n=>!n.hidden)?.focus?.();});}
    function decoratePortalHome(main){setRouteClass(main,'sd143-portal-home');makeSearch($('.portal-hero',main),'.service-grid .service-card','np. dostęp, sprzęt, konto, awaria…');}
    function decorateProjectPortal(main){setRouteClass(main,'sd143-project-portal');const shell=$('[class*="portal-accent-"]',main)||main;shell.classList.add('sd143-project-shell');makeSearch($('.portal-hero',shell),'.service-grid .service-card','np. problem techniczny, dostęp, licencja…');for(const grid of $$('.service-grid',shell))grid.classList.add('sd143-request-list');const ticketSearch=$('.portal-search',shell);if(ticketSearch){ticketSearch.classList.add('sd143-ticket-search');const input=$('input[name="q"]',ticketSearch);if(input)input.placeholder='Szukaj w swoich zgłoszeniach';}}
    function decorateCustomerQueue(main){setRouteClass(main,'sd143-customer-queue');const h1=$('.page-heading h1',main);if(h1)h1.textContent='Moje zgłoszenia';}
    function decorateCustomerTicket(main){setRouteClass(main,'sd143-customer-ticket');const header=$('.sd14-ticket-header',main),layout=$('.ticket-layout',main);if(header&&layout&&!header.closest('.sd143-ticket-card')){const card=document.createElement('section');card.className='sd143-ticket-card';header.before(card);card.append(header,layout);}const primary=$('.sd14-ticket-main',main)||layout?.firstElementChild,form=$('form[data-form="comment"]',main);if(primary&&form&&!form.closest('.sd143-ticket-compose')){const wrap=document.createElement('section');wrap.className='sd143-ticket-compose';wrap.innerHTML='<div class="sd143-compose-head"><strong>Dodaj komentarz</strong><span>Odpowiedź będzie widoczna dla zespołu obsługi.</span></div>';wrap.append(form);primary.prepend(wrap);}const conversation=$('.conversation',main);if(conversation&&!conversation.previousElementSibling?.classList?.contains('sd143-activity-heading')){const h=document.createElement('h2');h.className='sd143-activity-heading';h.textContent='Aktywność';conversation.before(h);}}
    function decorateDialog(){const dialog=$('#modal');if(!dialog)return;const portalForm=$('form[data-form="create-ticket"][data-portal="true"]',dialog);dialog.classList.toggle('sd143-portal-request-dialog',Boolean(portalForm));if(portalForm&&!dialog.querySelector('.sd143-request-intro')){const intro=document.createElement('div');intro.className='sd143-request-intro';intro.innerHTML='<span>PORTAL KLIENTA</span><strong>Opisz swoją sprawę</strong><p>Podaj najważniejsze informacje. Im dokładniejszy opis, tym szybciej zespół będzie mógł pomóc.</p>';portalForm.before(intro);}}
    function appendInline(parent,text){const re=/(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\(https?:\/\/[^)]+\))/g;let last=0,match;while((match=re.exec(text))){if(match.index>last)parent.append(document.createTextNode(text.slice(last,match.index)));const token=match[0];if(token.startsWith('**')){const strong=document.createElement('strong');strong.textContent=token.slice(2,-2);parent.append(strong);}else if(token.startsWith('`')){const code=document.createElement('code');code.textContent=token.slice(1,-1);parent.append(code);}else{const split=token.match(/^\[([^\]]+)\]\((https?:\/\/[^)]+)\)$/),a=document.createElement('a');a.textContent=split?.[1]||token;a.href=split?.[2]||'#';a.target='_blank';a.rel='noopener noreferrer';parent.append(a);}last=re.lastIndex;}if(last<text.length)parent.append(document.createTextNode(text.slice(last)));}
    function renderMarkdown(raw){const out=document.createElement('div');out.className='release-notes-rendered';const lines=String(raw||'').replace(/\r/g,'').split('\n');let ul=null,code=null;for(const line of lines){if(line.startsWith('```')){ul=null;if(code)code=null;else{const pre=document.createElement('pre');code=document.createElement('code');pre.append(code);out.append(pre);}continue;}if(code){code.textContent+=(code.textContent?'\n':'')+line;continue;}if(!line.trim()){ul=null;continue;}const heading=line.match(/^(#{1,4})\s+(.+)$/);if(heading){ul=null;const h=document.createElement('h'+Math.min(4,heading[1].length+1));appendInline(h,heading[2]);out.append(h);continue;}const bullet=line.match(/^\s*[-*]\s+(.+)$/);if(bullet){if(!ul){ul=document.createElement('ul');out.append(ul);}const li=document.createElement('li');appendInline(li,bullet[1]);ul.append(li);continue;}ul=null;const p=document.createElement('p');appendInline(p,line);out.append(p);}return out;}
    function decorateUpdates(){const active=route()==='#/admin/updates';document.body.classList.toggle('sd143-updates-view',active);if(!active)return;const main=$('#main');if(!main)return;main.classList.add('sd143-updates');const pre=$('pre.release-notes',main);if(pre){const rendered=renderMarkdown(pre.textContent);rendered.dataset.sd143Rendered='1';pre.replaceWith(rendered);}}
    function decorate(){const portal=$('.portal-workspace');document.body.classList.toggle('sd143-customer-portal',Boolean(portal));if(portal){const main=$('#main',portal);if(main&&!main.querySelector('.loading')){const r=route();if(r==='#/portal')decoratePortalHome(main);else if(r==='#/portal-home'||(location.pathname.startsWith('/portal/')&&r==='#/'))decorateProjectPortal(main);else if(r.startsWith('#/ticket/'))decorateCustomerTicket(main);else if(r==='#/queue')decorateCustomerQueue(main);}}decorateDialog();decorateUpdates();document.documentElement.dataset.customerPortalUi=VERSION;}

  })();
