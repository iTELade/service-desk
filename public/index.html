<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Service Desk — support portal and team workspace.">
  <title>Service Desk</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/app.css?v=1.0.1">
  <script>
    // Settings must stay inside the native Service Desk shell.
    // Legacy 1.0.1 behavior removed: location.replace('/v8.html#overview')
    (() => {
      const normalizeSettingsRoute = () => {
        if (location.hash === '#/settings' || location.hash.startsWith('#/settings?')) {
          const suffix = location.hash.slice('#/settings'.length);
          history.replaceState(null, '', location.pathname + location.search + '#/admin-settings' + suffix);
        }
      };
      const syncSettingsNav = () => {
        if (!location.hash.startsWith('#/admin-settings')) return;
        document.querySelectorAll('a[href="#/settings"],a[href="/#/settings"]').forEach(link => {
          link.classList.add('selected');
          link.setAttribute('aria-current', 'page');
        });
      };
      normalizeSettingsRoute();
      addEventListener('hashchange', () => {
        normalizeSettingsRoute();
        queueMicrotask(syncSettingsNav);
      });
      addEventListener('DOMContentLoaded', () => {
        const observer = new MutationObserver(syncSettingsNav);
        observer.observe(document.body, {childList:true, subtree:true});
        syncSettingsNav();
      });
    })();
  </script>
  <script src="/i18n.js?v=1.0.1"></script>
  <script type="module" src="/app.js?v=1.0.1"></script>
  <script defer src="/security.js?v=1.0.1"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="app"><main id="main" class="loading">Loading Service Desk…</main></div>
  <div id="notices" class="notices" role="status" aria-live="polite"></div>
  <dialog id="modal"></dialog>
  <noscript>Enable JavaScript to use the Service Desk portal.</noscript>
</body>
</html>
