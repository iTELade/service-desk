<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Service Desk 1.0.2 Administration</title>
  <link rel="stylesheet" href="/app.css?v=1.0.2">
  <script src="/i18n.js?v=1.0.2"></script>
  <script type="module" src="/v8.js?v=1.0.2"></script>
  <style>
    .admin-shell{max-width:1600px;margin:auto;padding:24px}.admin-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}.admin-nav{position:sticky;top:20px;display:grid;gap:18px}.admin-nav-group{display:grid;gap:6px}.admin-nav-group h3{margin:0 0 4px;padding:0 10px;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;opacity:.62}.admin-nav button{width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:9px;cursor:pointer}.admin-nav button:hover,.admin-nav button.active{background:var(--surface-2,#182236)}.admin-content{min-width:0}.admin-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.admin-card{padding:18px;border:1px solid var(--border,#26344a);border-radius:14px;background:var(--surface,#101927)}.admin-card h3{margin:0 0 8px}.admin-card p{margin:0;opacity:.75}.admin-status{display:inline-flex;align-items:center;gap:6px;font-size:.8rem}.admin-status:before{content:'';width:8px;height:8px;border-radius:50%;background:#7d8ca3}.admin-status.ok:before{background:#3ccf91}.admin-status.bad:before{background:#ff6b6b}.admin-status.warn:before{background:#f7b955}.admin-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.admin-section-head h2{margin:0}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}.code-box{white-space:pre-wrap;overflow:auto;max-height:360px}.danger-zone{border-color:#6f3030}.admin-kv{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:8px 16px}.admin-kv dt{opacity:.65}.admin-kv dd{margin:0;word-break:break-word}@media(max-width:900px){.admin-grid{grid-template-columns:1fr}.admin-nav{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}.admin-content{width:100%}}@media(max-width:600px){.admin-shell{padding:14px}.admin-nav{grid-template-columns:1fr}.admin-kv{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="admin-shell">
  <div class="page-heading"><div><div class="eyebrow">SERVICE DESK 1.0.2</div><h1>Administration Center</h1><p>System configuration, integrations, diagnostics and extensions in one place.</p></div><a class="button" href="/#/">Back to Service Desk</a></div>
  <div id="status" class="notice" hidden></div>
  <div class="admin-grid">
    <aside class="admin-nav" id="tabs" aria-label="Administration sections">
      <div class="admin-nav-group"><h3>General</h3><button data-tab="overview">Overview</button><button data-tab="general">Organization & language</button></div>
      <div class="admin-nav-group"><h3>Identity & access</h3><button data-tab="identity">Users, LDAP & SSO</button><button data-tab="security">Security</button></div>
      <div class="admin-nav-group"><h3>Service management</h3><button data-tab="service">Projects & workflows</button><button data-tab="approvals">Approvals</button><button data-tab="organizations">Organizations</button></div>
      <div class="admin-nav-group"><h3>Assets / CMDB</h3><button data-tab="assets">Assets & configuration items</button></div>
      <div class="admin-nav-group"><h3>Communication</h3><button data-tab="communication">Mail & notifications</button></div>
      <div class="admin-nav-group"><h3>Integrations</h3><button data-tab="integrations">Integration hub</button><button data-tab="github">GitHub Issues</button><button data-tab="plugins">Plugins</button></div>
      <div class="admin-nav-group"><h3>System</h3><button data-tab="diagnostics">Diagnostics</button><button data-tab="audit">Audit</button><button data-tab="maintenance">Updates & maintenance</button></div>
    </aside>
    <section id="content" class="admin-content panel detail-panel"><div class="loading">Loading…</div></section>
  </div>
</main>
</body>
</html>
