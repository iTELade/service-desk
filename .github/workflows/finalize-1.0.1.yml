name: Finalize Service Desk 1.0.1

on:
  push:
    branches:
      - release/1.0.1
    paths:
      - scripts/finalize-1.0.1.mjs
      - .github/workflows/finalize-1.0.1.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply final 1.0.1 fixes
        run: node scripts/finalize-1.0.1.mjs
      - name: Commit final source changes
        run: |
          set -euo pipefail
          rm scripts/finalize-1.0.1.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: complete Service Desk 1.0.1 regression coverage"
          git push origin HEAD:release/1.0.1
