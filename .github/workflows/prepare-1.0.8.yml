name: Prepare Service Desk 1.0.8

on:
  push:
    branches: ["release/1.0.8"]
    paths: [".github/workflows/prepare-1.0.8.yml"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare sources
        run: python3 scripts/prepare-1.0.8.py
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate release
        run: |
          npm ci
          npm run check
          npm run test:ci
          bash -n scripts/upgrade.sh
      - name: Commit release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/v8.mjs lib/version.mjs package.json package-lock.json public/index.html public/settings-center.js public/settings-nav-complete.js tests/release-1.0.1.test.mjs tests/settings-center-race.test.mjs tests/settings-route-regression.test.mjs tests/settings-static-assets.test.mjs RELEASE_NOTES_1.0.8.md
          git commit -m "Service Desk 1.0.8: fix GitHub project and reporter choices"
          git push origin HEAD:release/1.0.8
