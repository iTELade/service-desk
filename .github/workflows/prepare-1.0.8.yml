name: Prepare Service Desk 1.0.8

on:
  push:
    branches:
      - "release/1.0.8"
    paths:
      - ".github/workflows/prepare-1.0.8.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "release/1.0.8"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p=Path(path)
              s=p.read_text()
              n=s.count(old)
              if n != expected:
                  raise SystemExit(f"{path}: expected {expected}, found {n}")
              p.write_text(s.replace(old,new))

          ui=Path('public/settings-center.js')
          s=ui.read_text()
          old="const projects=state.meta.projects.filter(p=>p.can_manage&&p.project_type!=='assets');"
          new="const projects=state.meta.projects.filter(p=>!p.archived);"
          if s.count(old)!=1: raise SystemExit('GitHub project filter anchor changed')
          ui.write_text(s.replace(old,new,1))

          v8=Path('lib/v8.mjs')
          s=v8.read_text()
          old="""  function githubOptions(u,projectId){
    admin(u);const p=projects.requireProject(integer(Number(projectId),'Project'),u,true);
    return {request_types:db.prepare('SELECT id,name,version FROM request_types WHERE project_id=? AND enabled=1 ORDER BY name').all(p.id),reporters:db.prepare(\"SELECT id,name,email,role,account_kind FROM users WHERE active=1 AND role IN ('admin','agent') ORDER BY name,email\").all()};
  }
"""
          new="""  function githubReporters(){
    return db.prepare(\"SELECT id,name,email,role,account_kind FROM users WHERE active=1 AND COALESCE(directory_active,1)=1 AND COALESCE(registration_state,'active')='active' AND COALESCE(account_kind,'human') IN ('human','service') ORDER BY CASE WHEN account_kind='service' THEN 0 ELSE 1 END,name,email\").all();
  }
  function githubOptions(u,projectId){
    admin(u);const p=projects.requireProject(integer(Number(projectId),'Project'),u,true);
    return {request_types:db.prepare('SELECT id,name,version FROM request_types WHERE project_id=? AND enabled=1 ORDER BY name').all(p.id),reporters:githubReporters()};
  }
"""
          if s.count(old)!=1: raise SystemExit('githubOptions anchor changed')
          s=s.replace(old,new,1)
          old2="reporter=db.prepare(\"SELECT * FROM users WHERE id=? AND active=1 AND role IN ('admin','agent')\").get(integer(Number(b.reporter_id),'Reporter'))"
          new2="reporter=githubReporters().find(x=>x.id===integer(Number(b.reporter_id),'Reporter'))"
          if s.count(old2)!=1: raise SystemExit('reporter validation anchor changed')
          v8.write_text(s.replace(old2,new2,1))

          replace('lib/version.mjs',"export const VERSION='1.0.7';","export const VERSION='1.0.8';")
          replace('package.json','"version": "1.0.7"','"version": "1.0.8"')
          for path in ['public/index.html','public/settings-center.js','public/settings-nav-complete.js','tests/settings-center-race.test.mjs','tests/settings-route-regression.test.mjs','tests/settings-static-assets.test.mjs']:
              p=Path(path); t=p.read_text(); p.write_text(t.replace('1.0.7','1.0.8').replace('1\\.0\\.7','1\\.0\\.8'))

          test=Path('tests/release-1.0.1.test.mjs')
          t=test.read_text()
          oldtest="const opts=await f.call('GET','/api/desk/v8/github-options',f.admin,{},'project_id='+f.project.id);assert.ok(opts.request_types.some(x=>x.id===f.requestType.id&&x.name===f.requestType.name));assert.ok(opts.reporters.some(x=>x.id===f.admin.id));const created=await f.call('POST','/api/desk/v8/github',f.admin,f.integrationBody());"
          newtest="const customer=user(f,'github-customer@example.test','customer'),service=user(f,'github-service@example.test','agent'),disabled=user(f,'github-disabled@example.test','customer');f.db.prepare(\"UPDATE users SET account_kind='service' WHERE id=?\").run(service.id);f.db.prepare('UPDATE users SET active=0 WHERE id=?').run(disabled.id);const opts=await f.call('GET','/api/desk/v8/github-options',f.admin,{},'project_id='+f.project.id);assert.ok(opts.request_types.some(x=>x.id===f.requestType.id&&x.name===f.requestType.name));assert.ok(opts.reporters.some(x=>x.id===f.admin.id));assert.ok(opts.reporters.some(x=>x.id===customer.id));assert.ok(opts.reporters.some(x=>x.id===service.id&&x.account_kind==='service'));assert.ok(!opts.reporters.some(x=>x.id===disabled.id));const created=await f.call('POST','/api/desk/v8/github',f.admin,f.integrationBody({reporter_id:customer.id}));assert.equal(created.reporter_id,customer.id);"
          if t.count(oldtest)!=1: raise SystemExit('GitHub functional test anchor changed')
          t=t.replace(oldtest,newtest,1)
          marker="test('GitHub Administration provides named dropdowns, CRUD controls and readable history',()=>{"
          extra="test('GitHub integration UI exposes every active project instead of hiding project types',()=>{const ui=source('public/settings-center.js');assert.match(ui,/state\\.meta\\.projects\\.filter\\(p=>!p\\.archived\\)/);assert.doesNotMatch(ui,/project_type!=='assets'/);assert.doesNotMatch(ui,/p\\.can_manage&&p\\.project_type/);});\n\n"
          if marker not in t: raise SystemExit('GitHub UI test marker missing')
          test.write_text(t.replace(marker,extra+marker,1))

          Path('RELEASE_NOTES_1.0.8.md').write_text("""# Service Desk 1.0.8

## GitHub Issues integration choices

- Show every active Service Desk project visible to the Global Administrator in the GitHub Issues project selector.
- Allow every active human or service account to be selected as Reporter / service account.
- Exclude inactive, directory-disabled and pending accounts.
- Validate saved reporters with the same eligibility rules as the dropdown.
- Add functional and UI regression tests for these choices.

Database schema remains **8**. No migration is required.
""")
          PY
          npm install --package-lock-only --ignore-scripts
      - name: Validate release
        run: |
          npm ci
          npm run check
          npm run test:ci
          bash -n scripts/upgrade.sh
      - name: Commit release changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/v8.mjs lib/version.mjs package.json package-lock.json public/index.html public/settings-center.js public/settings-nav-complete.js tests/release-1.0.1.test.mjs tests/settings-center-race.test.mjs tests/settings-route-regression.test.mjs tests/settings-static-assets.test.mjs RELEASE_NOTES_1.0.8.md
          git commit -m "Service Desk 1.0.8: fix GitHub project and reporter choices"
          git push origin HEAD:release/1.0.8
