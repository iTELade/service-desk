name: Prepare 1.1.3 UI
on:
  push:
    branches: [release/1.1.3-ui]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.1.3-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare version and assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          ver='1.1.3'
          p=Path('package.json'); d=json.loads(p.read_text()); d['version']=ver; p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          p=Path('lib/version.mjs'); s=p.read_text(); s=re.sub(r"VERSION='[^']+'",f"VERSION='{ver}'",s); p.write_text(s)
          p=Path('public/index.html'); s=p.read_text().replace('?v=1.1.2','?v=1.1.3')
          if '/release-1.1.3.css' not in s:s=s.replace('<link rel="stylesheet" href="/release-1.1.2.css?v=1.1.3">','<link rel="stylesheet" href="/release-1.1.2.css?v=1.1.3">\n  <link rel="stylesheet" href="/release-1.1.3.css?v=1.1.3">')
          if '/release-1.1.3.js' not in s:s=s.replace('<script defer src="/release-1.1.2.js?v=1.1.3"></script>','<script defer src="/release-1.1.2.js?v=1.1.3"></script>\n  <script defer src="/release-1.1.3.js?v=1.1.3"></script>')
          p.write_text(s)
          p=Path('server.mjs'); s=p.read_text()
          if "'/release-1.1.3.css'" not in s:s=s.replace("['/release-1.1.2.css', ['release-1.1.2.css', 'text/css; charset=utf-8']],", "['/release-1.1.2.css', ['release-1.1.2.css', 'text/css; charset=utf-8']],\n  ['/release-1.1.3.css', ['release-1.1.3.css', 'text/css; charset=utf-8']],")
          if "'/release-1.1.3.js'" not in s:s=s.replace("['/release-1.1.2.js', ['release-1.1.2.js', 'text/javascript; charset=utf-8']],", "['/release-1.1.2.js', ['release-1.1.2.js', 'text/javascript; charset=utf-8']],\n  ['/release-1.1.3.js', ['release-1.1.3.js', 'text/javascript; charset=utf-8']],")
          p.write_text(s)
          for f,pat,repl in [
            ('public/settings-center.js',"const SETTINGS_VERSION='1.1.2';","const SETTINGS_VERSION='1.1.3';"),
            ('public/settings-nav-complete.js',"const SETTINGS_NAV_VERSION = '1.1.2';","const SETTINGS_NAV_VERSION = '1.1.3';")]:
              p=Path(f); s=p.read_text(); p.write_text(s.replace(pat,repl))
          p=Path('public/i18n.js'); s=p.read_text()
          old=re.search(r"  function translateText\(value\) \{.*?\n  \}\n  function translateNode",s,re.S)
          if not old: raise SystemExit('translateText block not found')
          new="""  function translateText(value) {\n    const raw = String(value ?? '');\n    const target = index[locale];\n    const lead = raw.match(/^\\s*/)?.[0] || '';\n    const tail = raw.match(/\\s*$/)?.[0] || '';\n    const body = raw.slice(lead.length, raw.length - tail.length);\n    for (const row of terms) {\n      if (row.includes(body)) return lead + row[target] + tail;\n    }\n    return raw;\n  }\n  function translateNode"""
          s=s[:old.start()]+new+s[old.end():]; p.write_text(s)
          p=Path('README.md'); s=p.read_text().replace('# iTELade Service Desk 1.1.2','# iTELade Service Desk 1.1.3',1)
          marker='Self-hosted Service Desk / ITSM platform for customer support and internal IT operations.'
          if '## What is new in 1.1.3' not in s:
              pos=s.find('\n',s.find(marker)); insert='\n\n## What is new in 1.1.3\n\n- Jira-inspired agent workspace with a denser, clearer queue layout, sticky ticket headers and compact SLA / priority / assignee badges.\n- Stable background refresh: unchanged queue routes keep the current content visible while data refreshes instead of flashing a full-page loading state.\n- Safer global translation that no longer repeatedly expands labels such as `Normalny` or `Sortowanie`.\n- Reworked Administration Center navigation with settings search and clearer visual grouping.\n- Friendlier customer portal and public project portal with stronger service cards and faster access to personal tickets.\n'
              s=s[:pos+1]+insert+s[pos+1:]
          p.write_text(s)
          p=Path('MODULES.md'); s=p.read_text().replace('# Konfiguracja modułów Service Desk 1.1.2','# Konfiguracja modułów Service Desk 1.1.3',1); p.write_text(s)
          p=Path('CHANGELOG.md'); s=p.read_text()
          if not s.startswith('## 1.1.3'):
              s='## 1.1.3 - 2026-09-16\n\n- Reworked queue, settings and customer portal presentation toward a Jira Service Management-style information hierarchy.\n- Prevented same-route background refresh from replacing the queue with a full-page loading state.\n- Fixed unstable substring translation that could expand `Normalny` / `Sortowanie` repeatedly.\n- Added settings search, compact ticket badges, sticky queue headers and responsive filter disclosure.\n\n'+s
          p.write_text(s)
          # Keep current-version regression checks aligned without rewriting release-specific 1.1.2 feature tests.
          for f in ['tests/settings-route-regression.test.mjs','tests/settings-static-assets.test.mjs','tests/settings-center-race.test.mjs']:
              p=Path(f)
              if p.exists(): p.write_text(p.read_text().replace('1.1.2','1.1.3'))
          PY
          npm install --package-lock-only --ignore-scripts
      - name: Validate
        run: |
          npm ci
          npm run check
          npm run test:ci
          bash -n scripts/upgrade.sh
      - name: Commit prepared release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json lib/version.mjs public/index.html public/i18n.js public/settings-center.js public/settings-nav-complete.js server.mjs README.md MODULES.md CHANGELOG.md tests/settings-route-regression.test.mjs tests/settings-static-assets.test.mjs tests/settings-center-race.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Prepare Service Desk 1.1.3 UI release"
            git push origin HEAD:release/1.1.3-ui
          fi
