name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and static checks
        run: npm run check
      - name: Test suite
        run: npm run test:ci
      - name: Install browser
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser regression
        run: npm run test:browser
      - name: Workspace 2.1 regression — Chromium, Firefox, WebKit
        run: |
          npm run test:load
          for engine in chromium firefox webkit; do
            DESK_SCREENSHOTS="artifacts/workspace/$engine" DESK_BROWSER_ENGINE="$engine" npm run test:workspace
          done
      - name: Visual regression — all views and themes
        run: npm run test:visual
      - name: Upgrade script syntax
        run: bash -n scripts/upgrade.sh
      - name: Workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-2.1
          path: artifacts/workspace/

  knowledge:
    name: Knowledge Base (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Checkout standalone Knowledge Base fixture
        uses: actions/checkout@v4
        with:
          repository: iTELade/service-desk-knowledge-base
          ref: afefd4b98a0ed42ef704ad1452aa523923c28b62
          path: fixtures/knowledge-base
          persist-credentials: false
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Real Desk–KB integration
        env:
          DESK_BROWSER_ENGINE: ${{ matrix.engine }}
        run: npm run test:knowledge

  platform:
    name: Platform 2.2 (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Platform flows and virtual passkeys
        run: npm run test:platform
        env:
          DESK_BROWSER_ENGINE: ${{ matrix.engine }}
