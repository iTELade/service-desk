name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and static checks
        run: npm run check
      - name: Test suite
        run: npm run test:ci
      - name: Install browser
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser regression
        run: npm run test:browser
      - name: Workspace 2.1 regression — Chromium, Firefox, WebKit
        run: |
          npm run test:load
          for engine in chromium firefox webkit; do
            DESK_SCREENSHOTS="artifacts/workspace/$engine" DESK_BROWSER_ENGINE="$engine" npm run test:workspace
          done
      - name: Visual regression — all views and themes
        run: npm run test:visual
      - name: Upgrade script syntax
        run: bash -n scripts/upgrade.sh
      - name: Workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-2.1
          path: artifacts/workspace/

  knowledge:
    name: Knowledge Base (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Checkout standalone Knowledge Base fixture
        uses: actions/checkout@v4
        with:
          repository: iTELade/service-desk-knowledge-base
          ref: afefd4b98a0ed42ef704ad1452aa523923c28b62
          path: fixtures/knowledge-base
          persist-credentials: false
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Real Desk–KB integration
        env:
          DESK_BROWSER_ENGINE: ${{ matrix.engine }}
        run: npm run test:knowledge

  platform:
    name: Platform 2.2 (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Platform flows and virtual passkeys
        run: npm run test:platform
        env:
          DESK_BROWSER_ENGINE: ${{ matrix.engine }}

  upgrade:
    name: Upgrade and backup restore
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:upgrade

  container:
    name: Container (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build production image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: desk22-smoke:local
      - name: Startup, authentication, restart and backup
        run: |
          docker run -d --name desk22-smoke --platform linux/${{ matrix.arch }} -e NODE_ENV=test -e APP_URL=http://127.0.0.1:3000 -v desk22-smoke-data:/app/data desk22-smoke:local
          docker exec desk22-smoke node scripts/container-smoke.mjs
          docker restart desk22-smoke
          docker exec desk22-smoke node scripts/container-smoke.mjs --restart
      - name: Container diagnostics
        if: failure()
        run: docker logs desk22-smoke
      - name: Remove isolated container
        if: always()
        run: |
          docker rm -f desk22-smoke || true
          docker volume rm desk22-smoke-data || true
