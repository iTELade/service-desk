name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and static checks
        run: npm run check
      - name: Test suite
        run: npm run test:ci
      - name: Install browser
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser regression
        run: npm run test:browser
      - name: Workspace 2.1 regression — Chromium, Firefox, WebKit
        run: |
          npm run test:load
          for engine in chromium firefox webkit; do
            DESK_SCREENSHOTS="artifacts/workspace/$engine" DESK_BROWSER_ENGINE="$engine" npm run test:workspace
          done
      - name: Visual regression — all views and themes
        run: npm run test:visual
      - name: Upgrade script syntax
        run: bash -n scripts/upgrade.sh
      - name: Workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-2.1
          path: artifacts/workspace/
