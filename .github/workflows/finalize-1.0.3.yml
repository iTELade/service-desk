name: Finalize 1.0.3 metadata

on:
  push:
    branches: [release/1.0.3]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.3
          fetch-depth: 0
      - name: Prepend changelog and remove temporary workflows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          old=p.read_text()
          header='''## 1.0.3 - 2026-09-14\n\n- Rebuilt `/#/settings` as a complete Administration Center inside the normal Service Desk shell.\n- Replaced the previous chaotic tile wall with grouped navigation and one focused configuration area at a time.\n- Restored access to all administration areas: General, Identity & Access, Service Management, Communication, Integrations, Assets / CMDB and System.\n- Added direct administration for organization/registration, branding, SMTP and GitHub Issues inside Settings, with clear links to dedicated native submodules.\n- Retired the standalone `v8.html` administration interface; direct visits now redirect to `/#/settings`, and the old `v8.js` UI was removed.\n- Kept the one-way GitHub Issues flow and made label → priority mapping easier to edit using `label=P1` rows instead of raw JSON.\n- Bumped frontend cache keys and application version to 1.0.3; schema remains 8.\n\n'''
          if not old.startswith('## 1.0.3'):
              p.write_text(header+old)
          PY
          git rm -f .github/workflows/prepare-1.0.3.yml .github/workflows/finalize-1.0.3.yml
      - name: Commit final metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Finalize Service Desk 1.0.3 metadata"
          git push origin HEAD:release/1.0.3
