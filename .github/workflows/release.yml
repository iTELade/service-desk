name: Publish Service Desk

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag opublikowanego wydania, np. v0.7.0"
        required: true
        default: "v0.7.0"
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Sprawdzenie tagu i wydania
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag musi mieć format vX.Y.Z."
            exit 1
          fi

          gh release view "$RELEASE_TAG" \
            --json isDraft,isPrerelease > /tmp/desk-release-info.json

          node -e '
            const fs = require("node:fs");
            const release = JSON.parse(
              fs.readFileSync("/tmp/desk-release-info.json", "utf8")
            );
            if (release.isDraft || release.isPrerelease) {
              throw new Error("Wymagane opublikowane, stabilne wydanie.");
            }
          '

      - name: Pobranie kodu wskazanego wydania
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Sprawdzenie wersji aplikacji
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { VERSION } from "./lib/version.mjs";

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const expected = process.env.RELEASE_TAG.slice(1);

          if (pkg.version !== expected || VERSION !== expected) {
            throw new Error(
              `Niezgodne wersje: tag=${expected}, ` +
              `package.json=${pkg.version}, aplikacja=${VERSION}`
            );
          }
          NODE

      - name: Instalacja zależności i testy
        run: |
          npm ci
          npm run check
          npm test

      - name: Nazwa obrazu
        id: metadata
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Konfiguracja emulacji ARM64
        uses: docker/setup-qemu-action@v3

      - name: Konfiguracja Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Logowanie do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Budowanie i publikacja obrazu
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.image }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}

      - name: Utworzenie manifestu aktualizacji
        env:
          RELEASE_IMAGE: ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { VERSION, SCHEMA_VERSION } from "./lib/version.mjs";
          import { manifest } from "./lib/releases.mjs";

          const data = manifest({
            format: 1,
            project: "service-desk",
            version: VERSION,
            image: process.env.RELEASE_IMAGE,
            schema: SCHEMA_VERSION,
            minimum_schema: 6
          }, process.env.GITHUB_REPOSITORY, process.env.RELEASE_TAG);

          writeFileSync(
            "desk-release.json",
            JSON.stringify(data, null, 2) + "\n"
          );
          NODE

      - name: Dodanie manifestu do istniejącego wydania
        run: |
          gh release upload "$RELEASE_TAG" desk-release.json --clobber
