name: Prepare 1.0.3 lockfile

on:
  push:
    branches: [release/1.0.3]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh package lock root version
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh package-lock for 1.0.3"
          git push origin HEAD:release/1.0.3
