name: Publish version from main
on:
  push:
    branches: [main]
    paths:
      - MANIFEST.sha256
      - package.json
      - package-lock.json
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - server.mjs
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'updater/**'
      - '.github/workflows/publish-version.yml'
permissions:
  contents: write
  packages: write
concurrency:
  group: publish-version-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate release version
        id: version
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          import {VERSION} from './lib/version.mjs';
          const p=JSON.parse(readFileSync('package.json'));
          if(!/^\d+\.\d+\.\d+$/.test(VERSION)||p.version!==VERSION)throw Error('Invalid version');
          appendFileSync(process.env.GITHUB_OUTPUT,`tag=v${VERSION}\nimage=ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}\n`);
          NODE
      - name: Inspect existing release
        id: release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Existing stable release $TAG will be repaired/updated."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install and test
        run: |
          npm ci
          npm run check
          npm run test:ci
          bash -n scripts/upgrade.sh
          sha256sum -c MANIFEST.sha256
      - name: Install browser
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser regression
        run: npm run test:browser
      - name: Workspace 2.1 regression — Chromium, Firefox, WebKit
        run: |
          npm run test:load
          for engine in chromium firefox webkit; do
            DESK_SCREENSHOTS="artifacts/workspace/$engine" DESK_BROWSER_ENGINE="$engine" npm run test:workspace
          done
      - name: Visual regression — all views and themes
        run: npm run test:visual
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
      - name: Verify published container
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
          docker pull "$IMAGE"
          trap 'docker rm -f desk-release-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name desk-release-smoke -e APP_URL=https://desk-smoke.example "$IMAGE"
          healthy=0
          for attempt in $(seq 1 45); do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' desk-release-smoke)" == healthy ]]; then healthy=1; break; fi
            sleep 2
          done
          [[ "$healthy" == 1 ]]
          docker exec -e "DESK_EXPECTED_VERSION=${TAG#v}" desk-release-smoke node scripts/container-smoke.mjs
      - name: Publish release manifest
        env:
          TAG: ${{ steps.version.outputs.tag }}
          IMAGE: ${{ steps.build.outputs.digest }}
          RELEASE_EXISTS: ${{ steps.release.outputs.exists }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}@${IMAGE}"
          export IMAGE
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {VERSION,SCHEMA_VERSION} from './lib/version.mjs';
          import {manifest} from './lib/releases.mjs';
          writeFileSync('desk-release.json',JSON.stringify(manifest({format:1,project:'service-desk',version:VERSION,image:process.env.IMAGE,schema:SCHEMA_VERSION,minimum_schema:6},process.env.GITHUB_REPOSITORY,process.env.TAG),null,2)+'\n');
          NODE
          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            gh release upload "$TAG" desk-release.json --clobber
            gh release edit "$TAG" --title "Service Desk ${TAG#v}" --notes-file "RELEASE_NOTES_${TAG#v}.md"
          else
            gh release create "$TAG" desk-release.json --target "$GITHUB_SHA" \
              --title "Service Desk ${TAG#v}" --notes-file "RELEASE_NOTES_${TAG#v}.md"
          fi
