name: One-time 1.6 static map patch

on:
  push:
    branches:
      - release/1.6.0-agent-experience

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[static-map]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.6.0-agent-experience
      - name: Register 1.6 assets and remove one-time workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.mjs')
          text=p.read_text()
          css="  ['/agent-experience-1.6.css', ['agent-experience-1.6.css', 'text/css; charset=utf-8']],\n"
          js="  ['/agent-experience-1.6.js', ['agent-experience-1.6.js', 'text/javascript; charset=utf-8']],\n"
          if css.strip() not in text:
              marker="  ['/app.css', ['app.css', 'text/css; charset=utf-8']],\n"
              if marker not in text: raise SystemExit('app.css asset marker not found')
              text=text.replace(marker,marker+css,1)
          if js.strip() not in text:
              marker="  ['/release-1.2.0.js', ['release-1.2.0.js', 'text/javascript; charset=utf-8']],\n"
              if marker not in text: raise SystemExit('release controller asset marker not found')
              text=text.replace(marker,marker+js,1)
          p.write_text(text)
          PY
          rm -f .github/workflows/zz-once-1.6-static-map.yml
      - name: Commit static map patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.mjs .github/workflows/zz-once-1.6-static-map.yml
          git commit -m 'Serve Agent Experience 1.6 assets [static-map]'
          git push origin HEAD:release/1.6.0-agent-experience
