name: Fix 1.0.3 updater fixture

on:
  push:
    branches: [release/1.0.3]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.0.3
      - name: Keep updater fixture newer than installed version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/v6.test.mjs')
          s=p.read_text()
          old="const m={version:'1.0.3',schema:8,minimum_schema:6,tag:'v1.0.3',image:"
          new="const m={version:'1.0.4',schema:8,minimum_schema:6,tag:'v1.0.4',image:"
          if old not in s:
              raise SystemExit('expected updater fixture not found')
          p.write_text(s.replace(old,new,1))
          PY
          git rm .github/workflows/fix-1.0.3-updater-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/v6.test.mjs
          git commit -m "Fix 1.0.3 updater test fixture"
          git push origin HEAD:release/1.0.3
