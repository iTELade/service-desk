name: Prepare 1.1.2
on:
  push:
    branches: [release/1.1.2]
permissions:
  contents: write
concurrency:
  group: prepare-1.1.2
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply deterministic release transforms
        run: node scripts/prepare-1.1.2.mjs
      - name: Install and validate
        run: |
          npm ci
          npm run check
          npm run test:ci
          bash -n scripts/upgrade.sh
      - name: Commit prepared files
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No preparation changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare Service Desk 1.1.2 release files'
          git push origin HEAD:release/1.1.2
