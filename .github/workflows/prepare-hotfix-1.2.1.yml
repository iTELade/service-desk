name: Prepare updater UX hotfix 1.2.1
on:
  push:
    branches: [hotfix/1.2.1]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/1.2.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply 1.2.1 hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          NEW='1.2.1'

          # Version metadata.
          p=Path('package.json'); pkg=json.loads(p.read_text()); pkg['version']=NEW; p.write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n')
          p=Path('package-lock.json'); lock=json.loads(p.read_text()); lock['version']=NEW; lock['packages']['']['version']=NEW; p.write_text(json.dumps(lock,ensure_ascii=False,indent=2)+'\n')
          Path('lib/version.mjs').write_text("export const VERSION='1.2.1';\nexport const SCHEMA_VERSION=8;\n")

          # Cache keys and Administration Center version markers.
          p=Path('public/index.html'); p.write_text(p.read_text().replace('?v=1.2.0','?v=1.2.1'))
          p=Path('public/settings-center.js'); p.write_text(p.read_text().replace("const SETTINGS_VERSION='1.2.0';","const SETTINGS_VERSION='1.2.1';"))
          p=Path('public/settings-nav-complete.js'); p.write_text(p.read_text().replace("const SETTINGS_NAV_VERSION = '1.2.0';","const SETTINGS_NAV_VERSION = '1.2.1';"))

          # Add live updater progress and automatic post-update reload to the existing 1.2 UI layer.
          p=Path('public/release-1.2.0.js'); s=p.read_text().replace("const VERSION='1.2.0';","const VERSION='1.2.1';")
          if '1.2.1 updater UX hotfix' not in s:
              hotfix=r'''
          // 1.2.1 updater UX hotfix: live progress, restart resilience and one automatic reload.
          let updatePollTimer=null,updatePollBusy=false,lastUpdateStatus=null,updateReloadScheduled=false;
          const updatePhaseMeta={
            queued:{label:'Weryfikacja wydania',progress:8},
            pulling:{label:'Pobieranie obrazu',progress:28},
            backing_up:{label:'Kopia danych',progress:48},
            starting:{label:'Uruchamianie nowej wersji',progress:68},
            checking:{label:'Kontrola zdrowia',progress:86},
            committed:{label:'Zatwierdzanie wydania',progress:96},
            done:{label:'Aktualizacja zakończona',progress:100},
            failed:{label:'Aktualizacja przerwana',progress:100,bad:true},
            rollback:{label:'Przywracanie poprzedniej wersji',progress:78,warn:true},
            rolled_back:{label:'Przywrócono poprzednią wersję',progress:100,warn:true},
            rollback_failed:{label:'Wymagana interwencja administratora',progress:100,bad:true}
          };
          const updateEsc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          function ensureUpdateProgressStyles(){
            if($('#update-progress-121-style'))return;
            const style=document.createElement('style');style.id='update-progress-121-style';style.textContent=`
              #release-progress-121{margin:14px 0 0;padding:14px 15px;border:1px solid #dfe1e6;border-radius:6px;background:#fff;color:#172b4d;box-shadow:0 1px 2px rgba(9,30,66,.08)}
              #release-progress-121[hidden]{display:none!important}
              #release-progress-121.update-progress-bad{border-color:#ffbdad;background:#fff7f5}
              #release-progress-121.update-progress-warn{border-color:#f5cd47;background:#fffdf3}
              #release-progress-121.update-progress-offline{border-color:#85b8ff;background:#f7faff}
              .update-progress-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:9px}
              .update-progress-heading strong{font-size:13px;color:#172b4d}.update-progress-heading span{font-size:12px;font-weight:700;color:#44546f}
              .update-progress-track{position:relative;height:10px;overflow:hidden;border-radius:999px;background:#dfe1e6;box-shadow:inset 0 1px 1px rgba(9,30,66,.08)}
              .update-progress-track>span{display:block;height:100%;border-radius:inherit;background:#0c66e4;transition:width .35s ease}
              .update-progress-bad .update-progress-track>span{background:#c9372c}.update-progress-warn .update-progress-track>span{background:#e2b203}
              .update-progress-message{margin:9px 0 5px;font-size:12px;line-height:1.45;color:#44546f}
              .update-progress-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#626f86;font-size:10px}
              .update-progress-reload{margin-top:8px;padding:7px 9px;border-radius:4px;background:#e9f2ff;color:#0c66e4;font-size:11px;font-weight:650}
            `;document.head.append(style);
          }
          function ensureUpdateProgressHost(){
            const legacy=$('#release-job');if(!legacy)return null;
            let host=$('#release-progress-121');
            if(!host){host=document.createElement('section');host.id='release-progress-121';host.hidden=true;legacy.before(host);}
            return {host,legacy};
          }
          function scheduleUpdateReload(status){
            const job=status?.job;if(!job||!['done','rolled_back'].includes(job.phase)||updateReloadScheduled)return;
            const marker='desk.update.reload';
            try{if(sessionStorage.getItem(marker)===job.id)return;sessionStorage.setItem(marker,job.id);}catch{}
            updateReloadScheduled=true;
            const host=$('#release-progress-121');if(host&&!host.querySelector('.update-progress-reload'))host.insertAdjacentHTML('beforeend','<div class="update-progress-reload">Strona odświeży się automatycznie za chwilę…</div>');
            setTimeout(()=>location.reload(),1200);
          }
          function renderUpdateProgress(status,offline=false){
            const pair=ensureUpdateProgressHost();if(!pair)return;const {host,legacy}=pair,job=status?.job;
            if(!job){host.hidden=true;legacy.hidden=false;return;}
            const meta=updatePhaseMeta[job.phase]||{label:job.phase||'Aktualizacja',progress:5};
            const pct=Math.max(0,Math.min(100,Number(meta.progress)||0));
            legacy.hidden=true;host.hidden=false;host.className=(meta.bad?'update-progress-bad ':meta.warn?'update-progress-warn ':'')+(offline?'update-progress-offline':'');
            const message=offline?'Połączenie z aplikacją zostało chwilowo przerwane. To normalne podczas restartu — oczekiwanie na ponowne uruchomienie usługi…':(job.message||meta.label);
            const stamp=job.at?new Date(job.at).toLocaleString():'';
            host.innerHTML=`<div class="update-progress-heading"><strong>${updateEsc(meta.label)}</strong><span>${pct}%</span></div><div class="update-progress-track" role="progressbar" aria-label="Postęp aktualizacji" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div><p class="update-progress-message">${updateEsc(message)}</p><div class="update-progress-meta"><span>Wersja docelowa: ${updateEsc(job.version||'—')}</span><span>${updateEsc(stamp)}</span></div>`;
            if(!offline)scheduleUpdateReload(status);
          }
          async function pollUpdateStatus(){
            if(route()!=='#/admin/updates'){stopUpdatePolling();return;}if(updatePollBusy)return;updatePollBusy=true;
            try{
              const response=await fetch('/api/desk/updates',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});
              if(!response.ok)throw new Error('status '+response.status);
              const status=await response.json();lastUpdateStatus=status;renderUpdateProgress(status,false);
            }catch{if(lastUpdateStatus?.job)renderUpdateProgress(lastUpdateStatus,true);}
            finally{updatePollBusy=false;}
          }
          function startUpdatePolling(){if(updatePollTimer)return;void pollUpdateStatus();updatePollTimer=setInterval(()=>void pollUpdateStatus(),1250);}
          function stopUpdatePolling(){if(updatePollTimer){clearInterval(updatePollTimer);updatePollTimer=null;}updatePollBusy=false;}
          function updateHotfix(){
            if(route()!=='#/admin/updates'){stopUpdatePolling();return;}
            ensureUpdateProgressStyles();if(ensureUpdateProgressHost())startUpdatePolling();
          }
          document.addEventListener('visibilitychange',()=>{if(!document.hidden&&route()==='#/admin/updates')void pollUpdateStatus();});
          addEventListener('online',()=>{if(route()==='#/admin/updates')void pollUpdateStatus();});
          '''
              marker="  function enhance(){scheduled=false;surfaceClasses();addAdminNav();collapseSidebarControl();cleanSettingsNavigation();queuePolish();ticketPolish();tablesAndCards();settingsPolish();portalPolish();}"
              replacement=hotfix+'\n'+marker.replace('portalPolish();}','portalPolish();updateHotfix();}')
              if marker not in s: raise SystemExit('enhance marker not found')
              s=s.replace(marker,replacement)
          p.write_text(s)

          # Keep current-version regression tests aligned while preserving historical asset names.
          p=Path('tests/release-1.1.3-ui.test.mjs'); p.write_text(p.read_text().replace('1\\.2\\.0','1\\.2\\.1'))
          p=Path('tests/release-1.2.0-ui.test.mjs'); p.write_text(p.read_text().replace('?v=1.2.0','?v=1.2.1'))
          for name in ['tests/settings-center-race.test.mjs','tests/settings-static-assets.test.mjs','tests/settings-route-regression.test.mjs']:
              p=Path(name); p.write_text(p.read_text().replace('1.2.0','1.2.1').replace('1\\.2\\.0','1\\.2\\.1'))

          # Dedicated hotfix regression coverage.
          Path('tests/update-progress-1.2.1.test.mjs').write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const read=p=>readFileSync(new URL('../'+p,import.meta.url),'utf8');
          const ui=read('public/release-1.2.0.js');
          const index=read('public/index.html');
          const version=read('lib/version.mjs');
          test('1.2.1 updater shows live progress and survives service restart',()=>{
            assert.match(ui,/1\.2\.1 updater UX hotfix/);
            assert.match(ui,/updatePhaseMeta/);
            assert.match(ui,/role=\\"progressbar\\"/);
            assert.match(ui,/backing_up:\{label:'Kopia danych',progress:48\}/);
            assert.match(ui,/cache:'no-store'/);
            assert.match(ui,/update-progress-offline/);
          });
          test('1.2.1 updater reloads the page exactly once after terminal success or rollback',()=>{
            assert.match(ui,/\['done','rolled_back'\]\.includes\(job\.phase\)/);
            assert.match(ui,/sessionStorage\.getItem\(marker\)===job\.id/);
            assert.match(ui,/setTimeout\(\(\)=>location\.reload\(\),1200\)/);
          });
          test('1.2.1 version and cache keys are aligned',()=>{
            assert.match(version,/VERSION='1\.2\.1'/);
            assert.match(index,/app\.js\?v=1\.2\.1/);
            assert.match(index,/release-1\.2\.0\.js\?v=1\.2\.1/);
            assert.doesNotMatch(index,/\?v=1\.2\.0/);
          });
          ''')

          # Release notes and documentation.
          Path('RELEASE_NOTES_1.2.1.md').write_text('''# Service Desk 1.2.1\n\nService Desk 1.2.1 is a focused updater UX and reliability hotfix for the 1.2 interface release. Database schema remains **8** and no migration is required.\n\n## Update experience\n\n- The **Wersja i aktualizacje** page now polls update status continuously while it is open.\n- A visible progress bar presents the updater phases: release verification, image pull, data backup, new-version startup, health verification and final commit.\n- The current progress remains visible when the application container temporarily stops during the update. The page reports that it is waiting for the service instead of appearing frozen.\n- Opening or reloading the update page while an update is already running reconnects to the existing updater job and restores the progress display.\n- After a successful update the browser automatically reloads once, so the newly installed frontend is loaded without requiring a manual refresh.\n- A completed rollback also triggers one refresh so the browser is synchronized with the restored application.\n- Automatic reload is guarded by the updater job ID in session storage to prevent reload loops.\n\n## Compatibility and safety\n\n- The updater backend, backup/rollback process, fixed role model and project authorization rules are unchanged.\n- Schema version remains **8**.\n- The progress percentage represents updater milestones, not byte-level image download progress.\n- Existing 1.2.0 installations can update directly to 1.2.1.\n\n## Validation\n\nCI validates syntax, the complete automated test suite and the upgrade shell script. The hotfix adds regression coverage for progress rendering, restart/offline state, cache busting and one-time automatic reload.\n''')

          p=Path('README.md'); s=p.read_text()
          s=s.replace('# iTELade Service Desk 1.2.0','# iTELade Service Desk 1.2.1',1)
          s=s.replace('**Service Desk 1.2.0**','**Service Desk 1.2.1**',1)
          current=re.compile(r'1\.2\.0 is a major interface and usability release\..*?Detailed notes: \[RELEASE_NOTES_1\.2\.0\.md\]\(RELEASE_NOTES_1\.2\.0\.md\)\n',re.S)
          replacement='''1.2.1 is a focused updater UX hotfix for the 1.2 interface release. The update page now shows live milestone progress, survives the temporary application restart, reconnects to an in-progress updater job and automatically reloads the browser once when the update or rollback finishes.\n\nRelease: https://github.com/iTELade/service-desk/releases/tag/v1.2.1\n\nDetailed notes: [RELEASE_NOTES_1.2.1.md](RELEASE_NOTES_1.2.1.md)\n'''
          s,n=current.subn(replacement,s,count=1)
          if n!=1: raise SystemExit('README current release block not found')
          marker='## What is new in 1.2.0\n'
          hot='''## What is new in 1.2.1\n\n- live update progress bar with clear updater phases,\n- status polling that reconnects after the application container restarts,\n- visible restart/offline state instead of a seemingly frozen update page,\n- one automatic browser reload after a successful update or completed rollback, protected against reload loops,\n- no schema change; existing 1.2.0 installations update directly.\n\n'''
          if '## What is new in 1.2.1' not in s:s=s.replace(marker,hot+marker,1)
          s=s.replace('Service Desk 1.2.0 keeps database schema version **8**. Existing 1.1.x data and integrations remain compatible with the 1.2.0 interface release.','Service Desk 1.2.1 keeps database schema version **8**. Existing 1.1.x and 1.2.0 data and integrations remain compatible; this hotfix does not require a database migration.')
          p.write_text(s)

          p=Path('CHANGELOG.md'); s=p.read_text()
          if not s.startswith('## 1.2.1'):
              s='''## 1.2.1 - 2026-09-16\n\n- Updates: live milestone progress bar on the update page.\n- Updates: polling survives the temporary application restart and reports the reconnecting state.\n- Updates: the browser reloads automatically once after a successful update or completed rollback.\n- Updates: opening the page during an existing updater job reconnects to that job.\n- Schema remains 8; no database migration.\n\n'''+s
          p.write_text(s)

          p=Path('UPDATES.md'); s=p.read_text()
          marker='## Przebieg instalacji i powrót\n'
          note='''Od wersji **1.2.1** ekran aktualizacji pokazuje pasek postępu i na bieżąco odczytuje fazę zadania. Podczas restartu kontenera pozostawia ostatni postęp na ekranie i czeka na powrót API. Po pomyślnym zakończeniu aktualizacji albo rollbacku przeglądarka odświeża stronę automatycznie jeden raz.\n\n'''
          if note not in s:s=s.replace(marker,note+marker,1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Static checks
        run: npm run check
      - name: Test suite
        run: npm run test:ci
      - name: Upgrade shell syntax
        run: bash -n scripts/upgrade.sh
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/prepare-hotfix-1.2.1.yml
          git add -A
          git commit -m "Hotfix updater progress and auto-refresh for 1.2.1"
          git push origin HEAD:hotfix/1.2.1
