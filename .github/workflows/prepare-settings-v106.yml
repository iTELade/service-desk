name: Verify Settings 1.0.6

on:
  push:
    branches: [fix/settings-v106]
    paths:
      - .github/workflows/prepare-settings-v106.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/settings-v106
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify final Settings implementation
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run test:ci
          bash -n scripts/upgrade.sh
