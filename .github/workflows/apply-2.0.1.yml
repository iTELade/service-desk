name: Apply Service Desk 2.0.1

on:
  push:
    branches:
      - release/2.0.1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply 2.0.1 corrective changes
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,existsSync,readdirSync} from 'node:fs';
          const read=p=>readFileSync(p,'utf8');
          const write=(p,s)=>writeFileSync(p,s);
          const replace=(p,a,b)=>{let s=read(p);if(!s.includes(a))throw new Error(`Missing patch anchor in ${p}: ${a.slice(0,80)}`);s=s.replace(a,b);write(p,s);};

          replace('public/release-1.1.2.js','let sessionCache=null,searchTimer=null,pendingCreateFiles=null;','let sessionCache=null,searchTimer=null,pendingCreateFiles=null,queueToolsPromise=null;');
          replace('public/release-1.1.2.js',"async function session(){if(sessionCache)return sessionCache;const r=await fetch('/api/me',{credentials:'same-origin'});if(!r.ok)throw new Error('Sesja wygasła.');sessionCache=await r.json();return sessionCache;}","async function session(){if(sessionCache)return sessionCache;const r=await fetch('/api/me',{credentials:'same-origin'});if(r.status===401)return null;if(!r.ok)throw new Error('Nie udało się sprawdzić sesji.');sessionCache=await r.json();return sessionCache;}");
          replace('public/release-1.1.2.js',"async function call(path,{method='GET',data}={}){const s=await session();const r=await fetch('/api'+path,","async function call(path,{method='GET',data}={}){const s=await session();if(!s)throw new Error('Sesja wygasła.');const r=await fetch('/api'+path,");
          replace('public/release-1.1.2.js',"const {route,query}=hashParts();if(route!=='#/queue')return;const current=(await session()).user||await session();if(current?.role==='customer')return;","const {route,query}=hashParts();if(route!=='#/queue'||document.querySelector('.auth-layout'))return;const sess=await session();if(!sess)return;const current=sess.user||sess;if(current?.role==='customer')return;");
          replace('public/release-1.1.2.js',"if(route==='#/queue'&&!document.querySelector('[data-r112-queue-tools]'))installQueueTools().catch(e=>toast(e.message,true));","if(route==='#/queue'&&!document.querySelector('[data-r112-queue-tools]')&&!queueToolsPromise){queueToolsPromise=installQueueTools().catch(e=>{if(!document.querySelector('.auth-layout'))toast(e.message,true);}).finally(()=>queueToolsPromise=null);}");

          write('lib/version.mjs',"export const VERSION='2.0.1';\nexport const SCHEMA_VERSION=9;\n");
          const pkg=JSON.parse(read('package.json'));pkg.version='2.0.1';write('package.json',JSON.stringify(pkg,null,2)+'\n');
          const lock=JSON.parse(read('package-lock.json'));lock.version='2.0.1';if(lock.packages?.[''])lock.packages[''].version='2.0.1';write('package-lock.json',JSON.stringify(lock,null,2)+'\n');

          for(const p of ['public/index.html','public/settings-center.js','public/security.js','public/agent-experience-1.6.js','public/release-1.1.3.js','public/release-1.2.0.js','public/settings-nav-complete.js']){
            if(!existsSync(p))continue;let s=read(p);s=s.replaceAll('2.0.0','2.0.1');write(p,s);
          }
          let css=read('public/design-system.css');css=css.replace('@media (max-width:850px)','@media (max-width:820px)');write('public/design-system.css',css);

          for(const name of readdirSync('tests')){
            if(!name.endsWith('.mjs'))continue;const p='tests/'+name;let s=read(p);s=s.replaceAll('2.0.0','2.0.1').replaceAll('2\\.0\\.0','2\\.0\\.1');write(p,s);
          }
          let validation=read('VALIDATION.md').replaceAll('2.0.0','2.0.1');write('VALIDATION.md',validation);
          let readme=read('README.md');readme=readme.replace(/^# iTELade Service Desk .*$/m,'# iTELade Service Desk 2.0.1').replace(/\*\*Service Desk 2\.0\.0\*\*/g,'**Service Desk 2.0.1**').replaceAll('releases/tag/v2.0.0','releases/tag/v2.0.1').replaceAll('RELEASE_NOTES_2.0.0.md','RELEASE_NOTES_2.0.1.md').replaceAll('ghcr.io/itelade/service-desk:v2.0.0','ghcr.io/itelade/service-desk:v2.0.1');write('README.md',readme);
          write('RELEASE_NOTES_2.0.1.md',`# Service Desk 2.0.1\n\n## Corrective UI and stability release\n- Fixed unauthenticated #/queue session-expired notification storms and duplicate queue-tool races.\n- Rebuilt the queue workspace into a compact triage layout with saved views, quick filters, sorting and collapsible column controls.\n- Rebuilt the board with compact filters, readable status counts and modern kanban columns/cards.\n- Fixed oversized user avatars and stabilized the users table.\n- Reworked Administration Center spacing, hierarchy, navigation and cards.\n- Added project-scoped workspace context: project identity in sidebar/topbar plus project-aware Queue, Board and Project settings navigation.\n- Reworked Projects into service-workspace entry cards.\n- Schema remains 9; upgrading from 2.0.0 requires no additional database migration.\n\n## Validation\nFull syntax/static checks, CI tests and upgrade-script syntax are release gates. Production rollout should additionally smoke-test login/logout, project switching, queue tools, board transitions, user administration, Settings, LDAP/SSO, mail and updater/rollback.\n`);
          let changelog=read('CHANGELOG.md');if(!changelog.includes('## 2.0.1'))changelog=`## 2.0.1\n\n- Corrective UI/stability release for the 2.0 workspace.\n- Fixed unauthenticated session-notice storms and duplicate queue tools.\n- Rebuilt queue, board, users and Administration Center presentation.\n- Added project-scoped navigation and project workspace identity.\n- Schema remains 9.\n\n${changelog}`;write('CHANGELOG.md',changelog);
          write('tests/hotfix-2.0.1.test.mjs',`import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport {readFileSync} from 'node:fs';\nconst read=p=>readFileSync(new URL('../'+p,import.meta.url),'utf8');\nconst shell=read('public/product-shell.js'),css=read('public/design-system.css'),legacy=read('public/release-1.1.2.js'),version=read('lib/version.mjs'),index=read('public/index.html');\ntest('2.0.1 version and cache boundary are aligned',()=>{assert.match(version,/VERSION='2\\.0\\.1'/);assert.match(version,/SCHEMA_VERSION=9/);for(const asset of ['app.css','design-system.css','i18n.js','security.js','app.js','settings-center.js','release-1.1.2.js','product-shell.js'])assert.match(index,new RegExp(asset.replaceAll('.','\\\\.')+'\\\\?v=2\\\\.0\\\\.1'));});\ntest('2.0.1 suppresses unauthenticated queue decoration races',()=>{assert.match(legacy,/queueToolsPromise/);assert.match(legacy,/document\\.querySelector\\('\.auth-layout'\\)/);assert.match(legacy,/r\\.status===401/);});\ntest('2.0.1 project workspace is project scoped',()=>{assert.match(shell,/function currentProject/);assert.match(shell,/function projectContext/);assert.match(shell,/#\\/queue\\?project=/);assert.match(shell,/#\\/board\\?project=/);assert.match(shell,/Project settings/);});\ntest('2.0.1 queue board users and settings redesign primitives exist',()=>{assert.match(shell,/cleanupQueueTools/);assert.match(shell,/wrapBoardFilters/);assert.match(shell,/sd201-users/);assert.match(shell,/sd201-settings-content/);assert.match(css,/\\.sd201-queue-tools/);assert.match(css,/\\.sd201-kanban/);assert.match(css,/\\.sd201-users \\.comment-avatar/);assert.match(css,/\\.sd201-settings-content/);assert.match(css,/@media \\(max-width:820px\\)/);});\n`);
          NODE
      - name: Install and validate
        run: |
          npm ci
          npm run check
          npm run test:ci
          bash -n scripts/upgrade.sh
      - name: Refresh release manifest
        run: |
          git add -A
          git ls-files -z | grep -zv '^MANIFEST.sha256$' | grep -zv '^.github/workflows/apply-2.0.1.yml$' | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
      - name: Commit final 2.0.1 candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize Service Desk 2.0.1 corrective release'
          git push origin HEAD:release/2.0.1
