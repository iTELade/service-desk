name: Prepare Service Desk 1.1.0

on:
  push:
    branches: [release/1.1.0]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply 1.1.0 changes
        run: |
          python3 .github/prepare_1_1_0.py
          python3 .github/patch_versions_1_1.py
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: |
          npm run check
          npm run test:ci
          bash -n scripts/upgrade.sh
      - name: Commit prepared release
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Service Desk 1.1.0: automatic requester provisioning"
          git push origin HEAD:release/1.1.0
