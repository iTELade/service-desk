name: Finalize Service Desk 2.0.0 manifest

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-1.6.2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Regenerate complete tracked checksum manifest
        shell: bash
        run: |
          git add -A
          : > MANIFEST.sha256.tmp
          while IFS= read -r -d '' rel; do
            if [[ "$rel" == "MANIFEST.sha256" ]]; then continue; fi
            if [[ -f "$rel" ]]; then
              digest="$(sha256sum "$rel" | cut -d' ' -f1)"
              printf '%s  ./%s\n' "$digest" "$rel" >> MANIFEST.sha256.tmp
            fi
          done < <(git ls-files -z | sort -z)
          mv MANIFEST.sha256.tmp MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
      - name: Publish manifest fix branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b release/2.0.0-manifest-fix
          git add MANIFEST.sha256
          git commit -m 'Finalize Service Desk 2.0.0 release manifest'
          git push -f origin HEAD:release/2.0.0-manifest-fix
