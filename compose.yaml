name: ${DESK_STACK_NAME:-itelade-desk}
services:
  desk:
    build: .
    image: service-desk:current
    container_name: ${DESK_CONTAINER_NAME:-itelade-desk}
    labels:
      com.service-desk.managed: "1"
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      CONTROL_DIR: /app/control
      TZ: Europe/Warsaw
    volumes:
      - desk-data:/app/data
      - desk-control:/app/control
    networks: [proxy]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    stop_grace_period: 35s
  updater:
    profiles: [updates]
    build:
      context: .
      dockerfile: updater/Dockerfile
    image: service-desk-updater:0.7.1
    container_name: ${DESK_CONTAINER_NAME:-itelade-desk}-updater
    restart: unless-stopped
    environment:
      DESK_CONTAINER_NAME: ${DESK_CONTAINER_NAME:-itelade-desk}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - desk-data:/app/data
      - desk-control:/app/control
      - desk-backups:/app/backups
    networks: [proxy]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
volumes:
  desk-data:
    name: ${DESK_DATA_VOLUME:-itelade-desk-data}
  desk-control:
    name: ${DESK_CONTROL_VOLUME:-itelade-desk-control}
  desk-backups:
    name: ${DESK_BACKUP_VOLUME:-itelade-desk-backups}
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy-manager_default}
